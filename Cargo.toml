[package]
name = "ac-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ac-client"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "fs",
    "macros",
    "signal",
    "time",
    "sync",
    "process",
] }
tokio-rustls = "0.26"

# TLS — must match the server's post-quantum provider
rustls              = { version = "0.23", default-features = false, features = ["std"] }
rustls-post-quantum = "0.2"
rustls-pemfile      = "2"
# CSR generation for EST enrolment. Pure Rust deliberately: the device ships
# without openssl (verified -- no openssl, no base64), so shelling out is not
# an option on a stock image.
rcgen               = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"] }

# Protobuf (same version as ac-server)
prost = "0.13"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
log        = "0.4"
syslog     = "7"
env_logger = "0.11"

# Error handling
thiserror = "2"
anyhow    = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Unix system calls (termios for serial port, process management)
nix  = { version = "0.29", features = ["fs", "process", "term"] }
libc = "0.2"

# Timestamps
chrono = "0.4"

# HTTP client for firmware downloads
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json"] }

# USP / TR-369 — WebSocket and MQTT MTPs
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rumqttc = "0.24"
uuid    = { version = "1", features = ["v4"] }
url     = "2"

# WebSocket key generation
rand = "0.8"
base64 = "0.22"

[build-dependencies]
prost-build = "0.13"

# Release binary size. Defaults (opt-level=3, 16 CGUs, no LTO) produced a
# 9.57 MB stripped aarch64-musl binary, which does not fit the overlay on a
# 16 MB-flash router -- that ruled out most of the consumer OpenWrt install
# base. These four settings bring it to 5.38 MB (-44%) with no source change.
#
# panic="abort" would save a further 0.50 MB. Deliberately not set: it turns a
# panic in any tokio task into an abort of the whole agent, and 0.5 MB is not
# worth changing crash behaviour on a device you cannot attach a debugger to.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
