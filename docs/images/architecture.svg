<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <linearGradient id="gAgent" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="gCtrl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="gMTP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="gDM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="gDB" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="gUI" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#db2777"/></linearGradient>
    <linearGradient id="gHW" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/></filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
    <marker id="arrBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" rx="12" fill="#f8fafc"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">OptimACS — TR-369 / USP Architecture</text>
  <text x="550" y="56" text-anchor="middle" font-size="12" fill="#64748b">ac-client (Agent) + ac-server (Controller) + APConfig (UI)</text>

  <!-- ═══════════ LEFT: OpenWrt Device ═══════════ -->
  <rect x="20" y="75" width="500" height="720" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="270" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">OpenWrt Device (ac-client)</text>

  <!-- Agent Core -->
  <rect x="40" y="112" width="210" height="105" rx="8" fill="url(#gAgent)" filter="url(#shadow)"/>
  <text x="145" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">USP Agent Core</text>
  <text x="145" y="155" text-anchor="middle" font-size="10" fill="#bfdbfe">Boot! / ValueChange / NotifyResp</text>
  <text x="145" y="170" text-anchor="middle" font-size="10" fill="#bfdbfe">GET · SET · ADD · DELETE · OPERATE</text>
  <text x="145" y="185" text-anchor="middle" font-size="10" fill="#bfdbfe">GetSupportedDM · GetInstances</text>
  <text x="145" y="200" text-anchor="middle" font-size="10" fill="#bfdbfe">Multi-Controller · Subscriptions</text>

  <!-- MTP Layer -->
  <rect x="270" y="112" width="230" height="105" rx="8" fill="url(#gMTP)" filter="url(#shadow)"/>
  <text x="385" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">MTP Layer (4 protocols)</text>
  <rect x="282" y="145" width="98" height="26" rx="4" fill="#fff" fill-opacity="0.2"/>
  <text x="331" y="163" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">WebSocket</text>
  <rect x="388" y="145" width="98" height="26" rx="4" fill="#fff" fill-opacity="0.2"/>
  <text x="437" y="163" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">MQTT</text>
  <rect x="282" y="178" width="98" height="26" rx="4" fill="#fff" fill-opacity="0.2"/>
  <text x="331" y="196" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">STOMP</text>
  <rect x="388" y="178" width="98" height="26" rx="4" fill="#fff" fill-opacity="0.2"/>
  <text x="437" y="196" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">CoAP</text>

  <!-- TR-181 Data Model -->
  <rect x="40" y="232" width="460" height="250" rx="8" fill="url(#gDM)" filter="url(#shadow)"/>
  <text x="270" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">TR-181:2.16 Data Model — 32 Modules · 95+ Objects · 400+ Parameters</text>

  <!-- DM module grid -->
  <g font-size="9" fill="#fff" text-anchor="middle">
    <!-- Row 1 -->
    <rect x="52" y="268" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="94" y="283">LocalAgent</text>
    <rect x="142" y="268" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="184" y="283">DeviceInfo</text>
    <rect x="232" y="268" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="274" y="283">MgmtServer</text>
    <rect x="322" y="268" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="364" y="283">WiFi</text>
    <rect x="412" y="268" width="76" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="450" y="283">Ethernet</text>
    <!-- Row 2 -->
    <rect x="52" y="296" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="94" y="311">Bridging</text>
    <rect x="142" y="296" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="184" y="311">IP + Stats</text>
    <rect x="232" y="296" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="274" y="311">Diagnostics</text>
    <rect x="322" y="296" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="364" y="311">DHCPv4</text>
    <rect x="412" y="296" width="76" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="450" y="311">DHCPv6</text>
    <!-- Row 3 -->
    <rect x="52" y="324" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="94" y="339">NAT/PortMap</text>
    <rect x="142" y="324" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="184" y="339">Firewall</text>
    <rect x="232" y="324" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="274" y="339">Routing</text>
    <rect x="322" y="324" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="364" y="339">DNS</text>
    <rect x="412" y="324" width="76" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="450" y="339">Hosts</text>
    <!-- Row 4 -->
    <rect x="52" y="352" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="94" y="367">PPP</text>
    <rect x="142" y="352" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="184" y="367">Users</text>
    <rect x="232" y="352" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="274" y="367">SoftwareModules</text>
    <rect x="322" y="352" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="364" y="367">QoS / SQM</text>
    <rect x="412" y="352" width="76" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="450" y="367">UPnP</text>
    <!-- Row 5 -->
    <rect x="52" y="380" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="94" y="395">BulkData</text>
    <rect x="142" y="380" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="184" y="395">DSL</text>
    <rect x="232" y="380" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="274" y="395">Optical/GPON</text>
    <rect x="322" y="380" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="364" y="395">802.1x</text>
    <rect x="412" y="380" width="76" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="450" y="395">VoIP/SIP</text>
    <!-- Row 6 -->
    <rect x="52" y="408" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="94" y="423">RouterAdv</text>
    <rect x="142" y="408" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="184" y="423">IPv6rd</text>
    <rect x="232" y="408" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="274" y="423">DSLite</text>
    <rect x="322" y="408" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="364" y="423">InterfaceStack</text>
    <rect x="412" y="408" width="76" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="450" y="423">Time/NTP</text>
    <!-- Row 7 -->
    <rect x="52" y="436" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="94" y="451">Firmware</text>
    <rect x="142" y="436" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="184" y="451">Security</text>
    <rect x="232" y="436" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="274" y="451">WireGuard</text>
    <rect x="322" y="436" width="84" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="364" y="451">OpenVPN</text>
    <rect x="412" y="436" width="76" height="22" rx="3" fill="#fff" fill-opacity="0.15"/><text x="450" y="451">Cellular</text>
  </g>

  <!-- Hardware / OS Layer -->
  <rect x="40" y="500" width="460" height="80" rx="8" fill="url(#gHW)" filter="url(#shadow)"/>
  <text x="270" y="524" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">OpenWrt Hardware Abstraction</text>
  <g font-size="9.5" fill="#cbd5e1" text-anchor="middle">
    <text x="100" y="545">UCI Config</text>
    <text x="195" y="545">ubus RPC</text>
    <text x="280" y="545">sysfs</text>
    <text x="355" y="545">/proc</text>
    <text x="430" y="545">opkg</text>
    <text x="100" y="565">Network · WiFi · DHCP · Firewall</text>
    <text x="355" y="565">Thermal · Net stats · Processes</text>
  </g>

  <!-- LuCI UI -->
  <rect x="40" y="600" width="460" height="60" rx="8" fill="url(#gUI)" filter="url(#shadow)"/>
  <text x="270" y="624" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">LuCI Web Interface (luci-app-aclient)</text>
  <text x="270" y="645" text-anchor="middle" font-size="10" fill="#fbcfe8">8 Tabs: Connection · TLS · Device · Intervals · Advanced · GNSS · Storage · Process</text>

  <!-- Conformance Tests -->
  <rect x="40" y="680" width="460" height="45" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="270" y="707" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">TP-286 Conformance: 32 tests (message roundtrip · record encoding · GetSupportedDM · subscriptions)</text>

  <!-- ═══════════ RIGHT: Server Side ═══════════ -->
  <rect x="580" y="75" width="500" height="500" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="830" y="98" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">OptimACS Controller (ac-server + APConfig UI)</text>

  <!-- Controller -->
  <rect x="600" y="112" width="220" height="105" rx="8" fill="url(#gCtrl)" filter="url(#shadow)"/>
  <text x="710" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">USP Controller</text>
  <text x="710" y="155" text-anchor="middle" font-size="10" fill="#ddd6fe">Status Poller (550+ paths)</text>
  <text x="710" y="170" text-anchor="middle" font-size="10" fill="#ddd6fe">Command Queue (GET/SET/ADD/DEL/OP)</text>
  <text x="710" y="185" text-anchor="middle" font-size="10" fill="#ddd6fe">Boot! · ValueChange · OnBoard</text>
  <text x="710" y="200" text-anchor="middle" font-size="10" fill="#ddd6fe">Certificate Provisioning (step-ca)</text>

  <!-- MTP Server -->
  <rect x="840" y="112" width="220" height="105" rx="8" fill="url(#gMTP)" filter="url(#shadow)"/>
  <text x="950" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Server MTP</text>
  <rect x="855" y="148" width="95" height="24" rx="4" fill="#fff" fill-opacity="0.2"/><text x="902" y="165" text-anchor="middle" font-size="10" fill="#fff">WebSocket :3491</text>
  <rect x="955" y="148" width="95" height="24" rx="4" fill="#fff" fill-opacity="0.2"/><text x="1002" y="165" text-anchor="middle" font-size="10" fill="#fff">MQTT (EMQX)</text>
  <text x="950" y="200" text-anchor="middle" font-size="10" fill="#a5f3fc">TLS 1.3 · mTLS · PQ (ML-KEM-768)</text>

  <!-- Database -->
  <rect x="600" y="240" width="220" height="80" rx="8" fill="url(#gDB)" filter="url(#shadow)"/>
  <text x="710" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">PostgreSQL / CockroachDB</text>
  <text x="710" y="283" text-anchor="middle" font-size="10" fill="#fef3c7">device_params · usp_agents</text>
  <text x="710" y="298" text-anchor="middle" font-size="10" fill="#fef3c7">usp_commands · usp_events</text>

  <!-- Web UI -->
  <rect x="840" y="240" width="220" height="80" rx="8" fill="url(#gUI)" filter="url(#shadow)"/>
  <text x="950" y="264" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">APConfig Web UI</text>
  <text x="950" y="283" text-anchor="middle" font-size="10" fill="#fbcfe8">FastAPI + Jinja2 · RBAC</text>
  <text x="950" y="298" text-anchor="middle" font-size="10" fill="#fbcfe8">GraphQL · Real-time events</text>

  <!-- API Endpoints -->
  <rect x="600" y="340" width="460" height="100" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="830" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">15 New REST API Endpoints</text>
  <g font-size="9" fill="#64748b" text-anchor="start">
    <text x="615" y="384">POST /diagnostics/ping · /diagnostics/traceroute</text>
    <text x="615" y="399">GET  /diagnostics · /packages · /ethernet · /users</text>
    <text x="615" y="414">CRUD /port-mappings · /firewall-rules</text>
    <text x="615" y="429">POST /software/install · /software/uninstall</text>
  </g>

  <!-- Telemetry -->
  <rect x="600" y="460" width="460" height="55" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="830" y="484" text-anchor="middle" font-size="11" font-weight="500" fill="#475569">Telemetry Pipeline: Redpanda → Vector → InfluxDB/ClickHouse → Grafana</text>
  <text x="830" y="502" text-anchor="middle" font-size="10" fill="#94a3b8">VictoriaMetrics · Loki/Promtail · Node Exporter · cAdvisor</text>

  <!-- ═══════════ Connection Arrows ═══════════ -->
  <!-- Agent ↔ Controller -->
  <line x1="500" y1="164" x2="600" y2="164" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <line x1="600" y1="178" x2="500" y2="178" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="550" y="156" text-anchor="middle" font-size="9" fill="#3b82f6" font-weight="500">USP Records</text>
  <text x="550" y="192" text-anchor="middle" font-size="9" fill="#8b5cf6" font-weight="500">GET/SET/OPERATE</text>

  <!-- Agent Core → DM -->
  <line x1="145" y1="217" x2="145" y2="232" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- DM → HW -->
  <line x1="270" y1="482" x2="270" y2="500" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Controller → DB -->
  <line x1="710" y1="217" x2="710" y2="240" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="580" y="545" width="500" height="50" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="608" cy="570" r="6" fill="url(#gAgent)"/><text x="620" y="574" font-size="9" fill="#475569">Agent</text>
  <circle cx="668" cy="570" r="6" fill="url(#gCtrl)"/><text x="680" y="574" font-size="9" fill="#475569">Controller</text>
  <circle cx="748" cy="570" r="6" fill="url(#gMTP)"/><text x="760" y="574" font-size="9" fill="#475569">Transport</text>
  <circle cx="820" cy="570" r="6" fill="url(#gDM)"/><text x="832" y="574" font-size="9" fill="#475569">Data Model</text>
  <circle cx="902" cy="570" r="6" fill="url(#gDB)"/><text x="914" y="574" font-size="9" fill="#475569">Database</text>
  <circle cx="972" cy="570" r="6" fill="url(#gUI)"/><text x="984" y="574" font-size="9" fill="#475569">Web UI</text>
  <circle cx="1032" cy="570" r="6" fill="url(#gHW)"/><text x="1044" y="574" font-size="9" fill="#475569">Hardware</text>
</svg>
