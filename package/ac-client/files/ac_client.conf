# ACP/1.0 client configuration
# Keys are case-insensitive.  Lines starting with # are comments.
# Values are trimmed of leading/trailing whitespace.
#
# After editing this file, run:
#   /etc/init.d/ac-client restart

# ── Server connection ─────────────────────────────────────────────────────────

# Controller hostname or IP address (required)
# For local testing, use your ac-server IP address (e.g., 192.168.10.5)
server_host   = gw.aether-io.com

# USP WebSocket MTP port (default: 3491)
server_port   = 443

# Full WebSocket URL for the USP MTP endpoint.
# When set, overrides the auto-built URL from server_host + server_port.
# For local testing: ws_url = wss://192.168.10.5:3491
ws_url        = wss://gw.aether-io.com/usp

# ── USP Message Transport Protocol (MTP) ────────────────────────────────────
# Which MTP(s) to use: websocket | mqtt | both
mtp           = websocket

# MQTT broker URL (required when mtp = mqtt or mtp = both)
# mqtt_url    = mqtt://emqx.optimcloud.com:1883

# TLS SNI name sent in the ClientHello; must match the server certificate CN.
# For local testing, use the server IP address (e.g., 192.168.10.5)
server_cn     = gw.aether-io.com

# ── TLS / certificates ────────────────────────────────────────────────────────
#
# Init certificate (used before the device is provisioned):
#   Deploy from the OptimACS server:  <client_dir>/00:00:00:00:00:00/
#
init_cert     = /etc/apclient/init/client.crt
init_key      = /etc/apclient/init/client.key

# CA certificate used to verify the server.
# build_tls_config() seeds its trust store ONLY from this file; no system or
# webpki roots are loaded. The default controller terminates TLS at a public
# CA (Let's Encrypt), so this points at the ca-bundle trust store. For a
# private controller, point this at that CA instead, e.g.
#   ca_file = /etc/apclient/init/ca.crt
ca_file       = /etc/ssl/certs/ca-certificates.crt

# Provisioned client certificate (written here by ac-client after CERT response)
cert_file     = /etc/apclient/certs/client.crt
key_file      = /etc/apclient/certs/client.key

# Directory where provisioned certs are saved
cert_dir      = /etc/apclient/certs

# ── Device identity ───────────────────────────────────────────────────────────
#
# MAC address sent in INIT packets and used as the device CN.
# Leave empty to auto-detect from br-lan / eth0 / wlan0.
mac_addr      =

# CPU architecture string (e.g. mipsel_24kc, aarch64_cortex-a53)
arch          =

# Device model string (e.g. dir300, tplink-c7)
sys_model     =

# ── Polling intervals (seconds) ───────────────────────────────────────────────

# How often to send CHECK_UPDATE to detect config changes
update_interval  = 60

# How often to send a STATUS heartbeat.
# This is also the only periodic traffic on the WebSocket MTP, so it must stay
# below the shortest idle timeout on the path or the connection is reaped
# before it fires. Cloudflare closes an idle WebSocket at ~126s; at the old
# default of 300 a board reconnected every 128-152s, at 60 it held.
status_interval  = 60

# ── GNSS receiver ─────────────────────────────────────────────────────────────
#
# Leave gnss_dev empty to disable GPS reporting.
# Example: gnss_dev = /dev/ttyUSB0
gnss_dev      =
gnss_baud     = 9600

# ── Storage paths ─────────────────────────────────────────────────────────────

# Scratch directory for downloaded firmware images
fw_dir        = /tmp/apclient/firmware

# PID file written at startup
pid_file      = /var/run/apclient.pid

# ── Process behaviour ─────────────────────────────────────────────────────────

# Run in background as a daemon (managed by procd, so leave as false here)
daemonize     = false

# Send log messages to syslog (true) or stderr (false)
log_syslog    = true
